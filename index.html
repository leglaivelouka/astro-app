<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astro App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <header>
    <h1>🔭 Astro App</h1>
  </header>

  <main>
    <section>
  <h2>Carte du ciel</h2>

  <iframe id="sky-frame" title="Carte du ciel"
    src="https://virtualsky.lco.global/embed/index.html?longitude=6.4384&latitude=48.2335&projection=stereo&constellations=true&constellationlabels=true&showstarlabels=true&showgalaxy=true&ecliptic=true&magnitude=6&live=true&az=229.6&lang=fr"></iframe>

  <div class="radar-controls">
    <button id="sky-loc">📍 Ma position</button>
    <span id="sky-place">Lieu par défaut</span>
  </div>
  <p class="credit">Planétarium : <a href="https://virtualsky.lco.global/" target="_blank" rel="noopener">VirtualSky</a> (Las Cumbres Observatory)</p>
</section>

    <section>
    <h2>Radar météo</h2>
    <div id="radar"></div>
    <div class="radar-controls">
    <button id="radar-play">▶ Lecture</button>
    <input id="radar-slider" type="range" min="0" max="0" value="0">
    <span id="radar-time">Chargement…</span>
    <button id="radar-loc">📍 Ma position</button>
    </div>
  <p class="credit">Weather data by <a href="https://www.rainviewer.com" target="_blank" rel="noopener">Rain Viewer</a></p>
</section>
  </main>

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
